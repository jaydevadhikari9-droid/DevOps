global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: delivery-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["delivery-metrics:8000"]
